name: codebase
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  intl: ^0.20.2
  pretty_dio_logger: ^1.4.0
  logger: ^2.7.0
  equatable: ^2.1.0
  either:
    path: ./packages/either
  field_validator:
    path: ./packages/field_validator
  language:
    path: ./packages/language
  themes:
    path: ./packages/themes
  dio: ^5.11.0
  go_router: ^17.3.0
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  phone_form_field: ^10.0.18
  phone_numbers_parser: ^9.0.24
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.2
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  flutter_animate: ^4.5.2
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  firebase_remote_config: ^6.5.5
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0
  permission_handler: ^12.0.3
  badges: ^3.2.0
  webview_flutter: ^4.14.1
  lottie: ^3.5.1
  path_provider: ^2.1.6
  video_player: ^2.13.0
  chewie: ^1.14.1
  file_picker: ^11.0.2
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  store_redirect: ^2.0.4
  flutter_html: ^3.0.0
  share_plus: ^13.3.0
  font_awesome_flutter: ^11.0.0

# Override win32 to v6.x to resolve conflict between share_plus/package_info_plus (which require win32 ^6.0.1) and file_picker (which constrains win32 ^5.9.0).
dependency_overrides:
  win32: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: ^4.4.0
  build_runner: ^2.15.1
  bloc_test: ^10.0.0
  mockito: ^5.6.4


flutter:
  uses-material-design: true

  assets:
    - language.yaml
    - assets/
    - assets/lang/
    - assets/icons/
    - assets/images/
    - assets/anim/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins/Poppins-Thin.ttf
          weight: 100

